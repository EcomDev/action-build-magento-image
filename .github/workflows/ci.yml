name: Verify Action
on:
  pull_request:
    paths-ignore:
      - .github/workflows/release.yml
      - '**/README.md'
      - CHANGELOG.md
      - .release-please-manifest.json
  push:
    paths-ignore:
      - .github/workflows/release.yml
      - '**/README.md'
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_call:

permissions:
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Generate Magento Version Matrix for Data Artifacts
        uses: ecomdev/action-build-magento-matrix@v1.0.1
        id: matrix
        with:
          months: 12
          sample-data: 'true'
          include-prerelease: 'true'

  build-magento:
    runs-on: ubuntu-latest
    needs: generate-matrix
    continue-on-error: ${{ matrix.stability != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.builds) }}
    steps:
      - uses: ecomdev/action-build-magento-data-artifact@v2.0.0
        id: build
        with:
          name: '${{ matrix.name }}'
          auth: '${{ secrets.COMPOSER_AUTH }}'
          repository: 'https://repo.magento.com/'
          meta-package: 'magento/project-community-edition'
          magento-version: '${{ matrix.magentoVersion }}'
          stability: '${{ matrix.stability }}'
          mariadb-version: '${{ matrix.mariaDbVersion }}'
          opensearch-version: '${{ matrix.openSearchVersion }}'
          php-version: '${{ matrix.phpVersion }}'
          sample-data: ${{ case(matrix.sampleData, 'true', 'false') }}
          token: '${{ github.token }}'

  build-container:
    runs-on: ubuntu-latest
    needs: [ generate-matrix, build-magento ]
    continue-on-error: ${{ contains(matrix.artifact, 'alpha') || contains(matrix.artifact, 'beta') || contains(matrix.artifact, 'rc') }}
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build linux/amd64 and linux/arm64 version of Docker image
        uses: ./
        with:
          artifact: ${{ matrix.artifact }}
          containerType: ${{ matrix.containerType }}
          imageName: ${{ github.repository }}/${{ matrix.containerType }}
          imageTags: ${{ matrix.tag }}
          version: ${{ matrix.version }}
          push: 'false'
          platforms: 'linux/amd64,linux/arm64'

  verify-multi-stage:
    name: Verify Multi-Stage Local Artifact & Container Runtime
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize Magento Build Environment
        id: init
        uses: ecomdev/action-build-magento-data-artifact/build-init@v2.0.0
        with:
          name: multi-stage-2.4.9
          php-version: '8.4'
          mariadb-version: '11.8'
          opensearch-version: '3.0'

      - name: Create Magento Project
        uses: ecomdev/action-build-magento-data-artifact/build-create-project@v2.0.0
        with:
          config-file: ${{ steps.init.outputs.config-file }}
          magento-version: '2.4.9'

      - name: Install Magento
        uses: ecomdev/action-build-magento-data-artifact/build-install@v2.0.0
        with:
          config-file: ${{ steps.init.outputs.config-file }}
          magento-version: '2.4.9'

      - name: Reindex Magento
        uses: ecomdev/action-build-magento-data-artifact/build-reindex@v2.0.0
        with:
          config-file: ${{ steps.init.outputs.config-file }}

      - name: Dump Magento Data
        id: dump
        uses: ecomdev/action-build-magento-data-artifact/build-dump@v2.0.0
        with:
          config-file: ${{ steps.init.outputs.config-file }}

      - name: Build MariaDB image from local dump
        uses: ./
        with:
          artifactPath: ${{ steps.dump.outputs.output-directory }}
          containerType: mariadb
          imageName: ${{ github.repository }}/mariadb
          imageTags: type=raw,value=smoke-test
          version: '11.8'
          platforms: linux/amd64
          load: 'true'

      - name: Build MySQL image from local dump
        uses: ./
        with:
          artifactPath: ${{ steps.dump.outputs.output-directory }}
          containerType: mysql
          imageName: ${{ github.repository }}/mysql
          imageTags: type=raw,value=smoke-test
          version: '8.4'
          platforms: linux/amd64
          load: 'true'

      - name: Build OpenSearch image from local dump
        uses: ./
        with:
          artifactPath: ${{ steps.dump.outputs.output-directory }}
          containerType: opensearch
          imageName: ${{ github.repository }}/opensearch
          imageTags: type=raw,value=smoke-test
          version: '3.0'
          platforms: linux/amd64
          load: 'true'

      - name: Build Media image from local dump
        uses: ./
        with:
          artifactPath: ${{ steps.dump.outputs.output-directory }}
          containerType: media
          imageName: ${{ github.repository }}/media
          imageTags: type=raw,value=smoke-test
          platforms: linux/amd64
          load: 'true'

      - name: Smoke test built database and OpenSearch containers
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_PREFIX=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          NET_NAME="smoke-test-net-${GITHUB_RUN_ID}"

          docker network create "${NET_NAME}"
          MARIADB_ID=$(docker run -d --rm --network "${NET_NAME}" --network-alias mariadb-smoke "${IMAGE_PREFIX}/mariadb:smoke-test")
          MYSQL_ID=$(docker run -d --rm --network "${NET_NAME}" --network-alias mysql-smoke "${IMAGE_PREFIX}/mysql:smoke-test")
          OPENSEARCH_ID=$(docker run -d --rm -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true "${IMAGE_PREFIX}/opensearch:smoke-test")
          trap 'docker stop "$MARIADB_ID" "$MYSQL_ID" "$OPENSEARCH_ID" >/dev/null 2>&1 || true; docker network rm "${NET_NAME}" >/dev/null 2>&1 || true' EXIT

          for pair in "MariaDB:${MARIADB_ID}" "MySQL:${MYSQL_ID}"; do
            label="${pair%%:*}"
            cid="${pair#*:}"
            ready=0
            for i in {1..30}; do
              if docker logs "${cid}" 2>&1 1>/dev/null | grep -q "ready for connections"; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "${ready}" -ne 1 ]; then
              echo "::error::${label} container did not report 'ready for connections' on stderr"
              docker logs "${cid}"
              exit 1
            fi
            test "$(docker inspect --format '{{json .Mounts}}' "${cid}")" = "[]"
            docker exec "${cid}" env | grep -q "^MYSQL_DATABASE=magento$"
          done

          docker run --rm --network "${NET_NAME}" --entrypoint bash ghcr.io/wardenenv/mariadb:11.8 -c '
            set -euo pipefail
            mariadb -hmariadb-smoke -umagento -pmagento --skip-ssl -Nse "SELECT COUNT(*) FROM store" magento
            mariadb -hmariadb-smoke -umagento -pmagento --skip-ssl -e "CREATE TABLE _smoke (id INT PRIMARY KEY); INSERT INTO _smoke VALUES (1); DROP TABLE _smoke;" magento
          '
          docker run --rm --network "${NET_NAME}" --entrypoint bash ghcr.io/wardenenv/mysql:8.4 -c '
            set -euo pipefail
            mysql -hmysql-smoke -umagento -pmagento -Nse "SELECT COUNT(*) FROM store" magento
            mysql -hmysql-smoke -umagento -pmagento -e "CREATE TABLE _smoke (id INT PRIMARY KEY); INSERT INTO _smoke VALUES (1); DROP TABLE _smoke;" magento
          '

          for i in {1..30}; do
            docker exec "$OPENSEARCH_ID" curl -fsS "http://127.0.0.1:9200/_cat/indices/magento2*" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec "$OPENSEARCH_ID" curl -fsS "http://127.0.0.1:9200/_cat/indices/magento2*"

      - name: Prepare dump directory without OpenSearch data
        id: dump-no-opensearch
        shell: bash
        env:
          DUMP_DIR: ${{ steps.dump.outputs.output-directory }}
        run: |
          set -euo pipefail
          NO_OS_DIR="${RUNNER_TEMP}/dump-no-opensearch"
          mkdir -p "${NO_OS_DIR}"
          cp "${DUMP_DIR}/db.sql.gz" "${DUMP_DIR}/media.tgz" "${NO_OS_DIR}/"
          echo "path=${NO_OS_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Verify OpenSearch build skips when search.tgz is absent
        id: skip-missing-archive
        uses: ./
        with:
          artifactPath: ${{ steps.dump-no-opensearch.outputs.path }}
          containerType: opensearch
          imageName: ${{ github.repository }}/opensearch
          imageTags: type=raw,value=smoke-test-skipped
          version: '3.0'
          platforms: linux/amd64

      - name: Verify OpenSearch build skips when version is omitted
        id: skip-missing-version
        uses: ./
        with:
          artifactPath: ${{ steps.dump.outputs.output-directory }}
          containerType: opensearch
          imageName: ${{ github.repository }}/opensearch
          imageTags: type=raw,value=smoke-test-skipped
          platforms: linux/amd64

      - name: Assert optional OpenSearch outputs
        shell: bash
        env:
          SKIPPED_ARCHIVE: ${{ steps.skip-missing-archive.outputs.skipped }}
          SKIPPED_VERSION: ${{ steps.skip-missing-version.outputs.skipped }}
        run: |
          set -euo pipefail
          test "${SKIPPED_ARCHIVE}" = "true"
          test "${SKIPPED_VERSION}" = "true"

